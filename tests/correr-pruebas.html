
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas de animación - SIMUCIN</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    #resumen {
      padding: 15px;
      margin: 20px 0;
      background: #e5e7eb;
      border-radius: 8px;
      font-weight: bold;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border: 1px solid #ccc;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      padding: 9px;
      margin: 5px 0;
      border-radius: 5px;
      overflow-wrap: anywhere;
    }

    .correcta {
      background: #d1fae5;
      color: #065f46;
    }

    .incorrecta {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>
  <h1>Pruebas de animación SIMUCIN</h1>

  <div id="resumen">Ejecutando pruebas...</div>

  <canvas id="canvas-pruebas" width="700" height="400"></canvas>

  <h2>Resultados</h2>
  <ul id="resultados"></ul>

  <!-- Motores bidimensionales: scripts clásicos -->
  <script src="../js/physics/lanzamiento-horizontal.js"></script>
  <script src="../js/physics/lanzamiento-parabolico.js"></script>

  <!-- Renderer y Animator -->
  <script type="module" src="../js/simulation/renderer.js"></script>
  <script type="module" src="../js/simulation/animator.js"></script>

  <!-- Pruebas -->
  <script type="module" src="./pruebas-animacion.js"></script>
</body>
</html>
